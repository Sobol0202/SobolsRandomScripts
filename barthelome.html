<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f829a">
<title>Barthelome · Ein kleines Fernseh-Leben</title>
<style>
  :root { --blue:#4f829a; --silver:#a2b1bf; --ink:#1d1d1b; --white:#ffffff; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; width:100%; background:var(--ink); }
  body { min-height:100dvh; display:flex; align-items:center; justify-content:center; font-family:Arial,Helvetica,sans-serif; color:var(--ink); overflow-x:hidden; }
  .game-frame { container-type:inline-size; position:relative; isolation:isolate; display:grid; grid-template-rows:17% 70% 13%; aspect-ratio:16/9; width:min(98.5vw,calc(98dvh * 16 / 9),1600px); background:var(--silver); border:.22cqw solid var(--ink); outline:1px solid var(--silver); overflow:hidden; }

  /* Eher altes Bildschirmgerät als Website-Dashboard. */
  .topbar { min-width:0; display:grid; grid-template-columns:23% minmax(0,1fr) 23%; align-items:stretch; gap:0; padding:1.25cqw 1.8cqw; background:var(--silver); border-bottom:.34cqw solid var(--ink); }
  .brand { min-width:0; display:flex; align-items:center; gap:.9cqw; padding-right:1cqw; border-right:.15cqw solid var(--ink); }
  .brand-icon { position:relative; flex:0 0 auto; display:block; width:3.35cqw; height:3.1cqw; background:var(--ink); border:.34cqw solid var(--ink); outline:.12cqw solid var(--white); outline-offset:.22cqw; }
  .brand-icon:before { content:""; position:absolute; inset:.23cqw .55cqw .6cqw .25cqw; border:.13cqw solid var(--white); background:var(--blue); }
  .brand-icon:after { content:""; position:absolute; right:.2cqw; bottom:.25cqw; width:.27cqw; height:.27cqw; background:var(--white); }
  .brand-name { font:900 1.5cqw/1.05 "Courier New",Courier,monospace; text-transform:uppercase; letter-spacing:-.05em; overflow-wrap:anywhere; }
  .brand-sub { margin-top:.54cqw; font:700 .7cqw/1.3 "Courier New",Courier,monospace; text-transform:uppercase; letter-spacing:.065em; }
  .now { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:.45cqw; padding:0 1.3cqw; overflow:hidden; min-width:0; }
  .eyebrow { display:flex; justify-content:center; align-items:center; gap:.55cqw; font:700 .74cqw/1 "Courier New",Courier,monospace; letter-spacing:.13em; color:var(--ink); text-transform:uppercase; }
  .live-dot { display:inline-block; width:.52cqw; height:.52cqw; background:var(--ink); border:.12cqw solid var(--white); }
  h1 { display:block; max-width:100%; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:800 2.38cqw/1.18 Arial,Helvetica,sans-serif; letter-spacing:-.04em; }
  .age-chip { display:block; color:var(--ink); font:700 .97cqw/1.2 "Courier New",Courier,monospace; letter-spacing:.035em; border-top:.13cqw solid var(--ink); padding:.43cqw 1.7cqw 0; }
  .meta { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; min-width:0; gap:.24cqw; border-left:.15cqw solid var(--ink); padding-left:.95cqw; }
  .date-mini { font:700 .71cqw/1.2 "Courier New",Courier,monospace; text-transform:uppercase; letter-spacing:.13em; }
  .meta-time { font:900 2.47cqw/1 "Courier New",Courier,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.075em; }
  .meta-date { font:600 .76cqw/1.3 Arial,Helvetica,sans-serif; text-align:right; }

  .stage { min-width:0; position:relative; overflow:hidden; background:var(--white); border-left:.14cqw solid var(--ink); border-right:.14cqw solid var(--ink); border-bottom:.19cqw solid var(--ink); }
  .stage svg { position:absolute; inset:0; display:block; width:100%; height:100%; }
  /* Nur einzelne Teile der gezeichneten Welt reagieren auf Berührungen. */
  #scene [data-interact] { cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; }
  #scene [data-interact]:focus-visible { outline:none; filter:drop-shadow(0 0 7px #ffffff); }
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .stage:after { content:""; position:absolute; z-index:2; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0,transparent 5px,#1d1d1b08 5px,#1d1d1b08 6px); }
  .stage-loc { position:absolute; z-index:4; left:1.4cqw; bottom:1.35cqw; max-width:32%; padding:.78cqw 1.1cqw .85cqw; background:var(--ink); color:var(--white); border:.16cqw solid var(--white); box-shadow:.25cqw .25cqw 0 var(--blue); }
  .stage-loc .label { font:700 .68cqw/1.15 "Courier New",Courier,monospace; letter-spacing:.08em; color:var(--silver); }
  .stage-loc .value { margin-top:.35cqw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:700 1.23cqw/1.13 Arial,Helvetica,sans-serif; }
  .stage-detail { position:absolute; z-index:4; right:1.45cqw; bottom:1.35cqw; max-width:33%; background:var(--white); border:.17cqw solid var(--ink); padding:.68cqw .85cqw; font:600 .89cqw/1.35 Arial,Helvetica,sans-serif; text-align:left; }
  .footer { display:grid; grid-template-columns:19% minmax(0,1fr) 21%; gap:1.25cqw; align-items:stretch; padding:1.05cqw 1.8cqw .7cqw; background:var(--white); }
  .phase-group { min-width:0; border-right:.16cqw solid var(--ink); display:flex; flex-direction:column; justify-content:center; padding-right:1cqw; }
  .footer-overline { font:700 .68cqw/1.2 "Courier New",Courier,monospace; letter-spacing:.09em; }
  .stage-label { margin-top:.35cqw; font:800 1.16cqw/1.1 Arial,Helvetica,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .life-group { min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .life-top { display:flex; justify-content:space-between; gap:.7cqw; margin-bottom:.56cqw; font:700 .73cqw/1.1 "Courier New",Courier,monospace; }
  .life-track { position:relative; height:.63cqw; border:.13cqw solid var(--ink); background:var(--silver); }
  .life-progress { position:absolute; inset:0 auto 0 0; width:0; background:var(--blue); transition:width .5s linear; }
  .life-marker { position:absolute; top:50%; left:0; width:1.1cqw; height:1.1cqw; transform:translate(-50%,-50%); background:var(--ink); border:.19cqw solid var(--white); outline:.13cqw solid var(--ink); transition:left .5s linear; }
  .life-ticks { position:relative; height:.93cqw; margin-top:.59cqw; font:700 .6cqw/1.1 "Courier New",Courier,monospace; color:var(--ink); }
  .life-ticks span { position:absolute; top:0; white-space:nowrap; }
  .life-ticks span:nth-child(1) { left:0; }
  .life-ticks span:nth-child(2) { left:22%; transform:translateX(-50%); }
  .life-ticks span:nth-child(3) { left:67%; transform:translateX(-50%); }
  .life-ticks span:nth-child(4) { right:0; }
  .motto-group { display:flex; flex-direction:column; justify-content:center; align-items:flex-end; text-align:right; padding-left:.9cqw; border-left:.16cqw solid var(--ink); }
  .small-legend { font:700 .67cqw/1.2 "Courier New",Courier,monospace; letter-spacing:.11em; text-transform:uppercase; }
  .motto { margin-top:.35cqw; font:italic 700 1.2cqw/1.08 Georgia,"Times New Roman",serif; letter-spacing:-.025em; }

  #scene { overflow:visible; }
  .character-float { animation:bob 3.4s steps(3,end) infinite; transform-origin:0 0; transform-box:fill-box; }
  .antenna-light { animation:pulse 2.5s steps(2,end) infinite; }
  .eye-blink { transform-origin:center; transform-box:fill-box; animation:blink 8s infinite; }
  .cloud-one { animation:drift 17s linear infinite alternate; }
  .cloud-two { animation:drift 22s linear infinite alternate-reverse; }
  .zzz { animation:floatZ 3.3s steps(6,end) infinite; opacity:0; }
  .zzz.two { animation-delay:1s; } .zzz.three { animation-delay:2s; }
  .screen-glow { opacity:.3; }
  .signal { animation:signal 2.7s infinite; }
  .raindrop { animation:rain 1.15s linear infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  @keyframes blink { 0%,42%,45%,80%,83%,100%{transform:scaleY(1)} 43%,81%{transform:scaleY(.08)} }
  @keyframes drift { from { transform:translateX(-20px); } to { transform:translateX(45px); } }
  @keyframes floatZ { 0%{transform:translate(0,13px) scale(.7);opacity:0} 18%{opacity:.85} 82%{opacity:.7} 100%{transform:translate(31px,-75px) scale(1.2);opacity:0} }
  @keyframes signal { 0%,100%{opacity:.3} 50%{opacity:1} }
  @keyframes rain { 0%{transform:translateY(-20px);opacity:0} 20%{opacity:.6} 100%{transform:translateY(170px);opacity:0} }
  /* Jede Tätigkeit besitzt eine kleine, wiederholbare Bewegungs-Choreografie. */
  .figure.action-dance,.figure.action-sing { animation:danceBody 1.15s ease-in-out infinite; transform-origin:center 76%; transform-box:fill-box; }
  .figure.action-walk,.figure.action-run,.figure.action-hide { animation:walkBody 1.9s ease-in-out infinite; }
  .figure.action-run { animation-duration:.75s; }
  .figure.action-nap,.figure.action-rest { animation:breathing 4s ease-in-out infinite; }
  .figure.action-typing,.figure.action-repair,.figure.action-mount { animation:workingBody 1.5s ease-in-out infinite; }
  .figure.action-ball { animation:catchBody 3.3s ease-in-out infinite; }
  .figure.action-read { animation:readBody 3.9s ease-in-out infinite; }
  .figure.action-stretch { animation:stretchBody 5s ease-in-out infinite; }
  .arm-left,.arm-right,.leg-left,.leg-right { transform-origin:0 0; }
  .action-dance .arm-left,.action-sing .arm-left { animation:armLeftDance 1.15s ease-in-out infinite; }
  .action-dance .arm-right,.action-sing .arm-right { animation:armRightDance 1.15s ease-in-out infinite; }
  .action-ball .arm-right { animation:throwArm 3.3s ease-in-out infinite; }
  .action-ball .arm-left { animation:catchArm 3.3s ease-in-out infinite; }
  .action-stretch .arm-left { animation:armLeftDance 5s ease-in-out infinite; }
  .action-stretch .arm-right { animation:armRightDance 5s ease-in-out infinite; }
  .action-typing .arm-right,.action-draw .arm-right,.action-craft .arm-right { animation:workHand .38s ease-in-out infinite alternate; }
  .action-repair .arm-right,.action-mount .arm-right,.action-build .arm-right { animation:workHand .9s ease-in-out infinite alternate; }
  .action-food .arm-right { animation:eating 2s ease-in-out infinite; }
  .action-walk .leg-left,.action-run .leg-left,.action-hide .leg-left { animation:legStep 1s ease-in-out infinite; }
  .action-walk .leg-right,.action-run .leg-right,.action-hide .leg-right { animation:legStep 1s ease-in-out infinite reverse; }
  .action-run .leg-left,.action-run .leg-right {animation-duration:.4s}
  .figure.action-swing {animation:swingBody 2s ease-in-out infinite}
  .tossed-ball { animation:ballToss 3.3s cubic-bezier(.35,.0,.6,1) infinite; }
  .stack-block {animation-duration:6.5s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  .block-one {animation-name:stackOne} .block-two {animation-name:stackTwo} .block-three {animation-name:stackThree}
  .toy-train {animation:trainRun 5s ease-in-out infinite alternate}
  .toy-wheel {animation:spin 1s linear infinite;transform-origin:center;transform-box:fill-box}
  .music-note {animation:musicFloat 2.5s ease-out infinite;opacity:0}
  .music-note.second {animation-delay:.8s} .music-note.third {animation-delay:1.6s}
  .swing-seat {animation:swing 2.2s ease-in-out infinite;transform-origin:0 0}
  .drawing-pen {animation:drawLine 1.8s ease-in-out infinite alternate}
  .sketch-line {stroke-dasharray:120;stroke-dashoffset:120;animation:sketch 3.6s ease-in-out infinite}
  .puzzle-piece {animation:puzzleIn 5s ease-in-out infinite}
  .plant-drop {animation:waterDrop 1.3s ease-in infinite;opacity:0}
  .plant-drop.b {animation-delay:.4s}.plant-drop.c{animation-delay:.8s}
  .lab-bubble {animation:labBubble 2.4s ease-out infinite;opacity:0}.lab-bubble.b{animation-delay:.8s}.lab-bubble.c{animation-delay:1.6s}
  .device-hang {animation:mountScreen 4s ease-in-out infinite}
  .cable-flow {stroke-dasharray:18 18;animation:cablePulse 1.2s linear infinite}
  .repair-gear,.film-reel {animation:spin 5s linear infinite;transform-origin:center;transform-box:fill-box}
  .typing-caret {animation:caret .75s steps(2,end) infinite}
  .typing-keys {animation:keyboardTap .6s steps(3,end) infinite}
  .film-light {animation:filmShimmer 3s ease-in-out infinite}
  .flash {animation:cameraFlash 4s steps(1,end) infinite;opacity:0}
  .talk-bubble {animation:meetingTalk 3s ease-in-out infinite;opacity:.15}.talk-bubble.second{animation-delay:1.2s}
  .food-steam {animation:steam 2s ease-in-out infinite;opacity:0}.food-steam.second{animation-delay:.7s}
  .held-object {transform-origin:center;transform-box:fill-box}
  .action-read .held-object {animation:bookRead 4s ease-in-out infinite}
  .action-repair .held-object {animation:repairTurn 1.2s ease-in-out infinite alternate}
  .action-typing .held-object {animation:keyboardTap .55s steps(2,end) infinite}
  @keyframes danceBody {0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-12px) rotate(5deg)}50%{transform:translateY(0) rotate(-3deg)}75%{transform:translateY(-12px) rotate(6deg)}}
  @keyframes walkBody {0%,100%{transform:translate(-10px,0)}50%{transform:translate(28px,-8px)}}
  @keyframes breathing {0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(1px) scaleX(1.015)}}
  @keyframes workingBody {0%,100%{transform:translateY(0)}50%{transform:translateY(3px) rotate(1deg)}}
  @keyframes catchBody {0%,12%,88%,100%{transform:translateY(0)}40%,50%{transform:translateY(-4px)}}
  @keyframes readBody {0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
  @keyframes stretchBody {0%,65%,100%{transform:translateY(0)}35%{transform:translateY(-12px) scaleY(1.03)}}
  @keyframes swingBody {0%,100%{transform:translate(-9px,0) rotate(-3deg)}50%{transform:translate(9px,-8px) rotate(3deg)}}
  @keyframes armLeftDance {0%,100%{transform:rotate(6deg)}50%{transform:rotate(65deg)}}
  @keyframes armRightDance {0%,100%{transform:rotate(-15deg)}50%{transform:rotate(-65deg)}}
  @keyframes throwArm {0%,8%,88%,100%{transform:rotate(0)}23%,65%{transform:rotate(-85deg)}}
  @keyframes catchArm {0%,8%,88%,100%{transform:rotate(0)}45%,69%{transform:rotate(22deg)}}
  @keyframes workHand {from{transform:rotate(-9deg)}to{transform:rotate(15deg)}}
  @keyframes eating {0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-42deg)}}
  @keyframes legStep {0%,100%{transform:rotate(13deg)}50%{transform:rotate(-13deg)}}
  @keyframes ballToss {0%,9%,91%,100%{transform:translate(171px,-119px) scale(1)}26%{transform:translate(133px,-312px) scale(.96)}48%,54%{transform:translate(68px,-410px) scale(.93)}76%{transform:translate(130px,-290px) scale(.96)}}
  @keyframes stackOne {0%,12%,83%,100%{transform:translate(-110px,0)}25%,73%{transform:translate(0,0)}}
  @keyframes stackTwo {0%,25%,83%,100%{transform:translate(108px,61px) rotate(12deg)}43%,73%{transform:translate(0,0) rotate(0)}}
  @keyframes stackThree {0%,43%,83%,100%{transform:translate(144px,122px) rotate(-15deg)}62%,73%{transform:translate(0,0) rotate(0)}}
  @keyframes trainRun {0%{transform:translateX(-70px)}100%{transform:translateX(140px)}}
  @keyframes musicFloat {0%{transform:translateY(30px) rotate(-7deg);opacity:0}22%{opacity:1}85%{opacity:.9}100%{transform:translateY(-100px) rotate(15deg);opacity:0}}
  @keyframes swing {0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}
  @keyframes drawLine {0%,100%{transform:translate(0,0) rotate(-15deg)}50%{transform:translate(65px,-18px) rotate(-3deg)}}
  @keyframes sketch {0%,12%{stroke-dashoffset:120}60%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:120}}
  @keyframes puzzleIn {0%,20%,85%,100%{transform:translate(94px,-66px) rotate(22deg)}45%,70%{transform:translate(0,0) rotate(0)}}
  @keyframes waterDrop {0%{transform:translateY(-16px);opacity:0}20%{opacity:1}100%{transform:translateY(68px);opacity:0}}
  @keyframes labBubble {0%{transform:translateY(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-90px) scale(1.6);opacity:0}}
  @keyframes mountScreen {0%,12%,100%{transform:translateY(45px)}45%,83%{transform:translateY(-23px)}}
  @keyframes cablePulse {to{stroke-dashoffset:-36}}
  @keyframes spin {to{transform:rotate(360deg)}}
  @keyframes caret {50%{opacity:0}}
  @keyframes keyboardTap {0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  @keyframes filmShimmer {0%,100%{opacity:.1}50%{opacity:.6}}
  @keyframes cameraFlash {0%,87%,94%,100%{opacity:0}90%{opacity:.9}}
  @keyframes meetingTalk {0%,100%{transform:translateY(0);opacity:.2}45%{transform:translateY(-15px);opacity:1}}
  @keyframes steam {0%{transform:translateY(12px);opacity:0}35%{opacity:.65}100%{transform:translateY(-40px);opacity:0}}
  @keyframes bookRead {0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes repairTurn {from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
  /* Kurzzeit-Reaktionen auf Klicks: getrennt von Barthelomes Tagesablauf. */
  .character-reaction { transform-origin:center bottom; transform-box:fill-box; }
  .interactive-character.is-startled .character-reaction { animation:startleJump .94s cubic-bezier(.18,.72,.38,1) both; }
  .shock-sign, .chew-effect { opacity:0; pointer-events:none; }
  .interactive-character.is-startled .shock-sign { animation:surprisePop .95s ease-out both; }
  .interactive-character.is-chewing .chew-effect { animation:chewFace .32s steps(2,end) 4; }
  .interactive-tree .tree-bends { transform-origin:0px 0px; }
  .interactive-tree.is-rustling .tree-bends { animation:treeRustle 1.3s ease-in-out both; }
  .rustle-leaf { opacity:0; }
  .interactive-tree.is-rustling .rustle-leaf { animation:leafFall 1.2s ease-in-out both; }
  .interactive-tree.is-rustling .rustle-leaf.b { animation-delay:.13s; }
  .interactive-tree.is-rustling .rustle-leaf.c { animation-delay:.23s; }
  .interactive-plant .plant-body { transform-origin:0px 45px; }
  .interactive-plant.is-rustling .plant-body { animation:plantRustle 1.05s ease-in-out both; }
  .interactive-cloud .cloud-shape { transform-origin:center; transform-box:fill-box; }
  .interactive-cloud.is-puffed .cloud-shape { animation:cloudPuff 1.2s ease-in-out both; }
  .window-shade { transform-origin:center top; transform-box:fill-box; transform:scaleY(0); }
  .interactive-window.is-peeking .window-shade { animation:shadeDrop 1.65s ease-in-out both; }
  .tv-bars { opacity:0; }
  .interactive-tv.is-testing .tv-bars { animation:tvTestPattern 2.2s steps(1,end) both; }
  .interactive-food.is-feeding .food-piece { animation:feedFly 1.1s cubic-bezier(.25,.5,.35,1) forwards; }
  @keyframes startleJump { 0%,100%{transform:translateY(0) scale(1)} 12%{transform:translateY(7px) scale(1.05,.94)} 32%{transform:translateY(-73px) rotate(-5deg) scale(.98,1.04)} 48%{transform:translateY(-63px) rotate(4deg)} 70%{transform:translateY(0) scale(1.04,.94)} 82%{transform:translateY(-12px)} }
  @keyframes surprisePop { 0%,8%{opacity:0;transform:translateY(15px) scale(.3)} 19%,65%{opacity:1;transform:translateY(-6px) scale(1.2)} 85%,100%{opacity:0;transform:translateY(-25px) scale(.7)} }
  @keyframes chewFace { 0%,100%{opacity:0;transform:scaleY(.4)} 50%{opacity:1;transform:scaleY(1)} }
  @keyframes treeRustle { 0%,100%{transform:rotate(0)} 14%{transform:rotate(-9deg)} 30%{transform:rotate(8deg)} 46%{transform:rotate(-7deg)} 64%{transform:rotate(5deg)} 79%{transform:rotate(-3deg)} }
  @keyframes leafFall { 0%{opacity:0;transform:translate(0,0) rotate(0deg)} 10%{opacity:1} 74%{opacity:.9} 100%{opacity:0;transform:translate(55px,110px) rotate(150deg)} }
  @keyframes plantRustle { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-12deg)} 44%{transform:rotate(11deg)} 67%{transform:rotate(-7deg)} 84%{transform:rotate(4deg)} }
  @keyframes cloudPuff { 0%,100%{transform:scale(1)} 23%{transform:scale(1.2,.8)} 49%{transform:scale(.87,1.16)} 76%{transform:scale(1.05,.97)} }
  @keyframes shadeDrop { 0%,100%{transform:scaleY(0)} 32%,57%{transform:scaleY(1)} }
  @keyframes tvTestPattern { 0%,9%,88%,100%{opacity:0} 10%,87%{opacity:1} }
  @keyframes feedFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 43%{opacity:1;transform:translate(var(--fly-mid),-125px) scale(.85) rotate(-14deg)} 83%{opacity:1;transform:translate(var(--fly-x),var(--fly-y)) scale(.25) rotate(10deg)} 100%{opacity:0;transform:translate(var(--fly-x),var(--fly-y)) scale(.04)} }
  @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.001ms!important; transition-duration:.001ms!important; } .interactive-character.is-startled .shock-sign { opacity:1; } }
  noscript { position:fixed; bottom:1rem; left:1rem; background:white; color:black; padding:1rem; font:14px Arial,sans-serif; }
</style>
</head>
<body>
<main class="game-frame" aria-label="Barthelome, das virtuelle Fernseh-Lebewesen">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"></span>
      <div><div class="brand-name">BARTHELOME</div><div class="brand-sub">Das kleine Fernseh-Leben</div></div>
    </div>
    <div class="now" aria-live="polite" aria-atomic="true">
      <div class="eyebrow"><span class="live-dot" aria-hidden="true"></span> Barthelome gerade</div>
      <h1 id="activity">Entdeckt die Welt</h1>
      <div class="age-chip" id="age">0 Jahre alt</div>
    </div>
    <div class="meta">
      <div class="date-mini">Ortszeit / Echtzeit</div>
      <div class="meta-time" id="time">00:00</div>
      <div class="meta-date" id="date">–</div>

  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const data=await response.json(),d=data.daily;
  if(!d?.time||d.time.length<3)throw new Error('Unvollständige Wetterdaten');
  weatherDays=d.time.slice(0,3).map((_,i)=>({code:d.weather_code[i],min:d.temperature_2m_min[i],max:d.temperature_2m_max[i]}));
  weatherError=false;
 }catch(error){console.warn('Wettervorhersage derzeit nicht verfügbar:',error);weatherDays=null;weatherError=true;weatherFetchDay='';}
 lastStateKey='';update();
}
function drawScene(date,age,event){const hr=date.getHours(),night=hr<7||hr>=21;
 let bg='',fg='',fore='';
 switch(event.scene){
 case 'sleep':bg=bedroom();fore=bedFront();break;
 case 'sick':bg=sickRoom();fore=bedFront();break;
 case 'nursery':bg=nursery();break;
 case 'kindergarten':bg=kindergarten();break;
 case 'school':bg=school();break;
 case 'playground':bg=playground();break;
 case 'construction':bg=construction();break;
 case 'workshop':bg=workbench();break;
 case 'coding':bg=coding();break;
 case 'library':bg=library();break;
 case 'kitchen':bg=kitchen();break;
 case 'cinema':bg=cinema();break;
 case 'garden':bg=garden();break;
 case 'course':bg=course();break;
 case 'memorial':bg=memorial();break;
 case 'travel':bg=travelScene(event.destination,night);break;
 default:bg=backgroundIndoor(night);
 }
 const indoor=['sleep','sick','nursery','kindergarten','school','construction','workshop','coding','library','kitchen','cinema','course','memorial'];
 if(event.scene!=='memorial'){
 if(['sleep','sick','nursery','kindergarten','school','coding','workshop','kitchen','course'].includes(event.scene))fg+=pottedPlant(1509,467,.72);
 fg+=character(age,event.mood,event.prop,event.scene,event.motion);
 fg+=actionArtwork(event,age);
 }
 const rain=(!indoor.includes(event.scene)&&dayHash(date)%13===0&&hr>=7&&hr<21)?rainyOverlay(dayHash(date)):'';
 return defs+bg+(indoor.includes(event.scene)&&event.scene!=='cinema'&&event.scene!=='memorial'?weatherPicture():'')+fg+fore+rain;
}
const reactionTimers=new WeakMap();
function reactOnce(node,className,duration){
 const old=reactionTimers.get(node);
 if(old)clearTimeout(old);
 node.classList.remove(className);
 void node.getBoundingClientRect();
 node.classList.add(className);
 reactionTimers.set(node,setTimeout(()=>node.classList.remove(className),duration));
}
function interact(node){
 const type=node.dataset.interact;
 const speak=message=>{$('interactionStatus').textContent=message;};
 switch(type){
  case 'character':
   reactOnce(node,'is-startled',970);
   speak('Huch! Barthelome hüpft erschrocken hoch.');
   break;
  case 'tree':
   reactOnce(node,'is-rustling',1320);
   speak('Die Blätter rascheln.');
   break;
  case 'plant':
   reactOnce(node,'is-rustling',1120);
   speak('Die Pflanze wackelt ein wenig.');
   break;
  case 'cloud':
   reactOnce(node,'is-puffed',1240);
   speak('Die Wolke plustert sich auf.');
   break;
  case 'window':
   reactOnce(node,'is-peeking',1700);
   speak('Das Rollo fährt kurz herunter und wieder hoch.');
   break;
  case 'tv':
   reactOnce(node,'is-testing',2290);
   speak('Der Fernseher zeigt kurz ein Testbild.');
   break;
  case 'food':
   if(node.classList.contains('is-feeding'))return;
   node.classList.add('is-feeding');
   speak('Das Essen fliegt zu Barthelome. Guten Appetit!');
   setTimeout(()=>{
    if(!node.isConnected)return;
    const character=$('scene').querySelector('.interactive-character');
    if(character)reactOnce(character,'is-chewing',1150);
   },830);
   setTimeout(()=>node.classList.remove('is-feeding'),3850);
   break;
 }
}
const sceneElement=$('scene');
sceneElement.addEventListener('click',event=>{
 const node=event.target.closest?.('[data-interact]');
 if(node&&sceneElement.contains(node))interact(node);
});
sceneElement.addEventListener('keydown',event=>{
 if(event.key!=='Enter'&&event.key!==' ')return;
 const node=event.target.closest?.('[data-interact]');
 if(!node||!sceneElement.contains(node))return;
 event.preventDefault();
 interact(node);
});
let lastStateKey='';
function fitHeadline(){
 const el=$('activity');el.style.fontSize='';
 const max=parseFloat(getComputedStyle(el).fontSize);let px=max;
 while(el.scrollWidth>el.clientWidth+2&&px>max*.51){px-=1;el.style.fontSize=`${px}px`;}
}
function update(){const now=new Date(),age=daysSinceBirth(now),activity=resolveActivity(now,age);
 $('time').textContent=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 $('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const key=[age,activity.title,activity.scene,activity.place,activity.mood,activity.prop,activity.motion,activity.number].join('|');
 if(key===lastStateKey)return;lastStateKey=key;
 $('activity').textContent=activity.title;
 fitHeadline();
 $('age').textContent=age<0?'Noch nicht geboren':age>=LEBENSJAHRE?'100 Lebensjahre':age===1?'1 Jahr alt':`${age} Jahre alt`;
 $('phase').textContent=phaseFor(age);
 $('place').textContent=activity.place;
 $('detail').textContent=activity.detail;
 const capped=Math.max(0,Math.min(LEBENSJAHRE,age));
 $('progress').style.width=`${capped}%`;
 $('marker').style.left=`${capped}%`;
 $('progressLabel').textContent=`Jahr ${capped} von ${LEBENSJAHRE}`;
 $('scene').innerHTML=drawScene(now,age,activity);
 $('scene').setAttribute('aria-label',`Barthelome ist ${age} Jahre alt und ${activity.title.toLocaleLowerCase('de-DE')}. Standort: ${activity.place}. Einige Dinge lassen sich anklicken.`);
}
update();updateWeather();setInterval(update,1000);setInterval(updateWeather,60*60*1000);window.addEventListener('resize',()=>{lastStateKey='';update()});
</script>
